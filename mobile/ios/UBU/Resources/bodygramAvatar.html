<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bodygram avatar rendering demo</title>
        <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
        <script type="importmap">
            {
              "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
              }
            }
        </script>
    </head>
    <body>
        <div id="avatarCanvas" class="avatarCanvas"></div>
        <script type="module">
            import * as THREE from 'three';
            import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

            let camera, scene, renderer;

            function showAvatar(avatarInBase64) {
                const avatarData = Uint8Array.from(atob(avatarInBase64), c => c.charCodeAt(0));
                const canvas = document.getElementById('avatarCanvas');
                const initialWidth = canvas.offsetWidth;
                const initialHeight = (canvas.offsetWidth / 4) * 3;

                // Create a new scene, and add some lights so our scene is lit.
                scene = new THREE.Scene();
                const ambientLight = new THREE.AmbientLight( 0x484848 );
                scene.add( ambientLight );

                // Create a new camera so we can view our scene. The provided position is sufficient to keep the avatar
                // in view for the purpose of this tutorial.
                camera = new THREE.PerspectiveCamera( 70, initialWidth / initialHeight, 0.01, 100 );
                camera.position.set( 0, 1.3, 1.5 );
                camera.rotation.set( -0.25,0,0 );
                camera.add( new THREE.PointLight( 0xffffff, 0.85 ) );
                scene.add( camera );

                // We will use the OBJLoader extension to load our avatar, then we add it to our current scene.
                const loader = new OBJLoader();
                scene.add(loader.parse(avatarData));

                // Create a new renderer, and add it to our canvas element.
                renderer = new THREE.WebGLRenderer( { antialias: true, canvas: canvas } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( initialWidth, initialHeight );

                // Add a controller for our camera to be able to rotate.
                const controls = new OrbitControls(camera, canvas);
                controls.target = new THREE.Vector3( 0, 0.85, 0 );
                controls.enablePan = false;
                controls.minDistance = 1.5;
                controls.maxDistance = 5;
                controls.addEventListener( 'change', () => renderer.render( scene, camera ) );
                camera.updateProjectionMatrix();
                controls.saveState();
                controls.update();

                // Render a frame to our canvas.
                renderer.render( scene, camera );
            }

            // Load our example avatar, and initialize our scene.
            // replace the value of myAvatarData with the string obtained from the API response (the field entry.avatar.data)
            const myAvatarData = ''
            showAvatar(myAvatarData);
        </script>
    </body>
</html>
