version: 0.2
phases: 
  install:
    commands:
      - aws --version
      - pip3 install awscli --upgrade --user
      - aws --version
  pre_build: 
    commands: 
    - echo Logging in to Amazon ECR.... 

    # update the following line with your own region
    - REPOSITORY_URI=851725593426.dkr.ecr.us-east-2.amazonaws.com/ubu-user-api
    - DEFAULT_REGION=us-east-2

    - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 851725593426.dkr.ecr.us-east-2.amazonaws.com

  build: 
    commands: 
    - echo Build started on `date` 
    - echo Building the Docker image... 

    - docker build -t ubu-user-api .
    - docker tag ubu-user-api 851725593426.dkr.ecr.us-east-2.amazonaws.com/ubu-user-api:latest
  post_build: 
    commands: 
    - echo Build completed on `date` 
    - echo pushing to repo

    # update the following line with the URI of your own ECR repository
    - docker push 851725593426.dkr.ecr.us-east-2.amazonaws.com/ubu-user-api:latest

    - echo Writing image definitions file... 
    - printf '{"ImageURI":"%s"}' $REPOSITORY_URI\:latest > imageDetail.json
    - cp appspec.ecs.yml appspec.yml
artifacts:
  files:
    - imageDetail.json
    - appspec.yml
